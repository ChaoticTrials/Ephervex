# A dark theme in the colors of the Modrinth website.
#
# Copy this file to ~/.config/ephervex/themes/modrinth.toml and choose
# "Modrinth" under Settings > General > Interface theme. See docs/themes.md
# for the format.
#
# Scroll bars and lists are drawn light under every parent.
#
# Every color is set here so the file also lists what a theme can change.
# A theme of your own only needs the colors it changes; the rest come from
# its parent.

format_version = 1
name = "Modrinth"
parent = "workbench"

# A theme folder can also replace the logo and the window icon. A single file
# has no branding folder, so this section is commented out. To use it, move
# this file to ~/.config/ephervex/themes/modrinth/theme.toml, put the images
# in ~/.config/ephervex/themes/modrinth/branding/, and remove the leading "# "
# from the three lines below. The names are relative to that branding folder.
#
# [branding]
# logo = "logo.png"
# icon = "icon.png"

[colors]
# Surfaces, from the window floor up to a popover.
background = "#16181c"
surface = "#1d1f23"
field = "#16181c"
elevated = "#26292f"
overlay = "#33363d"
border = "#34363c"
bar = "#111316"
header-ribbon-1 = "#00000000"
header-ribbon-2 = "#00000000"
header-ribbon-3 = "#00000000"
header-ribbon-4 = "#00000000"
header-ribbon-5 = "#00000000"
header-ribbon-6 = "#00000000"
well = "#0e0f12"

# Selection and toggles, tinted with the brand green.
selection = "#1a2f23"
selection-card = "#182a20"
selection-strong = "#1f4a31"
toggle-on = "#128a45"
toggle-knob = "#ecf9fb"
capture-active = "#153a26"

# Tones.
accent = "#1bd96a"
accent-secondary = "#4f9cff"
success = "#1bd96a"
warning = "#ffa347"
danger = "#ff5f80"

# Filled buttons. The primary green is deeper than the brand green so the
# light caption on it stays readable.
primary-fill = "#0f7a3c"
primary-fill-hover = "#107f3f"
on-primary = "#ecf9fb"
danger-fill = "#6e2233"
danger-fill-hover = "#8a2a40"

# Text.
text = "#ecf9fb"
text-secondary = "#b0bac5"
text-muted = "#98a1ad"
on-danger = "#fff0f3"
log-error = "#ff7a93"

# Server marks, catalogs and loaders.
server = "#c78aff"
modrinth = "#1bd96a"
curseforge = "#f47547"
vanilla = "#91bd59"
forge = "#5981c0"
neoforge = "#c0664d"

# The colors instance groups are told apart by.
group-tone-1 = "#4f9cff"
group-tone-2 = "#1bd96a"
group-tone-3 = "#ffa347"
group-tone-4 = "#c78aff"
group-tone-5 = "#ff6b9a"
group-tone-6 = "#3fd6c6"

# What is drawn over the window.
shadow = "#00000099"
scrim = "#000000a6"

# Outlines and hard shadows, and the grid over the window floor.
shadow-hard = "#000000"
border-strong = "#ecf9fb"
grid-line = "#ffffff09"

# The main action, and a caption on any accent or state fill.
accent-primary = "#1bd96a"
on-accent = "#0e0f12"

# What a host is doing.
state-running = "#1bd96a"
state-building = "#c78aff"
state-attention = "#ff496e"
state-stopped = "#4f9cff"
state-server = "#4f9cff"

# Sticky notes and warnings, and problem boxes.
note-fill = "#3a3320"
danger-soft = "#4a1f2a"

# Consoles and logs drawn on their own dark floor.
terminal = "#0e0f12"
on-terminal = "#d6dde5"
on-terminal-muted = "#7c8591"
terminal-error = "#ff7a93"

# The loader chip on a host card, with `text` drawn on it.
chip-forge = "#4a3626"
chip-neoforge = "#52301f"
chip-vanilla = "#2f4a26"
