[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.6.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
publish = false
repository = "https://github.com/ChaoticTrials/ephervex"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Pedantic lints that fight the domain rather than help it.
# doc_markdown flags every product name written in prose - NeoForge,
# CurseForge, LiteLoader, OpenJDK - which this codebase is necessarily full of.
doc_markdown = "allow"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
# Correctness rules that matter for a launcher handling untrusted archives.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
dbg_macro = "warn"
todo = "warn"

[workspace.dependencies]
# --- internal crates (path deps; dependency direction enforced in docs/architecture.md) ---
ephervex-model = { path = "crates/model" }
ephervex-storage = { path = "crates/storage" }
ephervex-download = { path = "crates/download" }
ephervex-minecraft = { path = "crates/minecraft" }
ephervex-auth = { path = "crates/auth" }
ephervex-java = { path = "crates/java" }
ephervex-loaders = { path = "crates/loaders" }
ephervex-mod-platform = { path = "crates/mod-platform" }
ephervex-pack = { path = "crates/pack" }
ephervex-options = { path = "crates/options" }
ephervex-server = { path = "crates/server" }
ephervex-i18n = { path = "crates/i18n" }
ephervex-core = { path = "crates/core" }

# --- external stack (versions resolved by `cargo add`, not hand-written) ---
anyhow = "1.0.104"
# `AccountProvider` and `LoaderProvider` are held behind trait objects (ADR
# 0005). Native async trait methods are not dyn-compatible, so both use this
# adapter and the services layer can depend on their interfaces.
async-trait = "0.1.91"
# URL-safe base64 for PKCE challenges. `default-features = false` drops the
# crate's SIMD path, which this workspace has no throughput reason to want.
base64 = { version = "0.23.1", default-features = false, features = ["std"] }
chrono = { version = "0.4.45", features = ["serde"] }
copypasta = "0.10.2"
clap = { version = "4.6.6", features = ["derive"] }
clap_complete = "4.6.9"
directories = "6.0.0"
# `servers.dat` is Minecraft's own multiplayer server list, in NBT. Read and
# written through `Value` so a hand-added entry, or a field this launcher
# does not know about, round-trips untouched.
fastnbt = "2.6.3"
flate2 = "1.1.9"
futures-util = "0.3.33"
# The OS entropy source, used for PKCE verifiers and OAuth `state` values. A
# full RNG crate would be more than this needs: these are one-shot secrets that
# must come from the kernel, never from a seeded userspace generator.
getrandom = "0.4.3"
hex = "0.4.3"
# Provider artwork only. The codec list is exactly what a mod catalog serves as
# a project icon on the decode side, plus PNG on the encode side, because PNG is
# the one format every desktop image decoder this launcher ships with reads.
# `default-features = false` keeps the rest of the format zoo, and its
# dependencies, out of the build.
image = { version = "0.25.9", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
i18n-embed = { version = "0.16.0", features = ["fluent-system", "desktop-requester"] }
i18n-embed-fl = "0.10.1"
keyring = "4.1.6"
# MD5 exists for exactly one reason: Minecraft derives an offline player's UUID
# with `UUID.nameUUIDFromBytes`, which is MD5-based. Ephervex must reproduce
# that byte for byte or a client and its own linked test server would disagree
# about who the player is. Not used for anything security-bearing.
md-5 = "0.11.0"
open = "5.4.1"
# `form` is needed by `ephervex-auth`: every OAuth token request is
# `application/x-www-form-urlencoded`, which is the one body shape the identity
# platform accepts there.
reqwest = { version = "0.13.4", default-features = false, features = ["form", "gzip", "http2", "json", "rustls", "stream", "system-proxy"] }
rfd = "0.17.2"
quick-xml = { version = "0.38.4", features = ["serialize"] }
rusqlite = { version = "0.40.1", features = ["bundled"] }
raw-window-handle = "0.6.2"
rust-embed = "8.12.0"
rustix = { version = "1.1.4", features = ["fs", "process"] }
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha1 = "0.11.0"
sha2 = "0.11.0"
# `raw-window-handle-06` exposes a window's native handle, which is how a
# window can be given a size constraint the toolkit does not model itself.
# `unstable-winit-030` reaches the windowing events Slint does not model at all.
# File drops are the one this build needs: Slint's own drag-and-drop carries
# text and images between elements of the same application, and never a path
# from the desktop. The feature is explicitly unstable across Slint minor
# releases, so what is built on it is one small handler in the frontend.
slint = { version = "1.17.1", features = ["raw-window-handle-06", "unstable-winit-030"] }
sysinfo = "0.39.6"
fontdb = "0.23.0"
tar = "0.4.46"
tempfile = "3.27.0"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "fs", "process", "io-util", "sync", "time", "signal"] }
tokio-util = { version = "0.7.19", features = ["io"] }
toml = "1.1.4"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
unic-langid = "0.9.6"
uuid = { version = "1.24.0", features = ["v4", "serde"] }
# Reaches one X11 window property the toolkit does not model: the aspect a
# window manager may resize a window through.
x11rb = "0.13.2"
zip = "8.6.0"

# --- test-only ---
# Drives a real `AppWindow` headlessly so a layering mistake in the Slint markup
# can be caught by a test rather than only by clicking the running application.
i-slint-backend-testing = { version = "1.17.1", features = ["renderer-software"] }
wiremock = "0.6.5"

[profile.release]
lto = "thin"
strip = "symbols"
