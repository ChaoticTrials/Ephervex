# Builds the Linux release artifacts and publishes them as a Forgejo release
# whenever a version tag (for example v1.0.0) is pushed.
#
# Three artifacts, built from one checkout in one job: the AppImage, whose name
# is the same on every release so a download address stays valid, and the Debian
# and RPM packages, which carry their version in their file names because that
# is what a package manager reads (ADR 0026). What identifies a release is its
# tag, the release page, and what the binaries report for `--version`, which is
# why the tag and the workspace version have to agree before anything is built.
#
# **x86_64 only.** The GitHub workflow builds both release architectures on
# runners of their own, because each one has to be built natively: every check
# the packaging scripts run inspects and executes the binaries it produced.
# Forgejo runs on one self-hosted x86_64 machine, so an aarch64 release from
# here would have to be cross-built and would arrive unverified. ARM releases
# belong to GitHub.
#
# Unlike the GitHub workflow, this one does not publish into the shared apt
# repository, and has no credentials for it. The packages are attached to the
# release and nothing else.
#
# Nothing here is cached: a release runs a few times a year, and a cargo cache
# for this workspace is gigabytes the runner host keeps between them.
#
# The glibc floor in packaging/linux-baseline is enforced against the binaries
# the job produced rather than against the image that built them: the packaging
# scripts read the highest GLIBC_ symbol version they require and refuse
# anything above the floor. A runner image too new to reach it fails the build
# rather than shipping a package that will not start.
#
# The default `docker` label is a node:lts image, which is Debian bookworm and
# carries glibc 2.36, above the 2.35 floor. That is not a problem in itself:
# what matters is the highest symbol version the binaries actually reference,
# and bookworm's glibc does not have the newer symbols a more recent one would
# offer, so both binaries come out requiring exactly 2.35 and pass. It is a
# narrow margin held by the check rather than by the image, which is the point.
# When node:lts moves to a newer Debian, the packaging step is where that shows
# up, and the answer is to build in an image that reaches the floor rather than
# to raise the floor.
#
# `appimagetool` and the AppImage type-2 runtime are host dependencies that
# build-appimage.sh never downloads. Provisioning them is this workflow's job,
# and it fetches exactly what packaging/host-tools pins and verifies each digest
# before use. See docs/release.md and ADR 0023.
#
# The release is created through the Forgejo REST API with a personal access
# token stored as the repository secret RELEASE_TOKEN (Settings -> Actions ->
# Secrets). Use a token with repository write access belonging to your account,
# so the release is published under your name rather than the "Ghost" user the
# automatic per-run token is attributed to.
#
# An optional CURSEFORGE_API_KEY repository secret is baked into the release
# binaries as the default CurseForge API key (ADR 0030). Leave it unset and
# the release ships with no built-in key, same as any other build.

name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  artifacts:
    runs-on: docker
    steps:
      - name: Install build dependencies
        # The package set docs/release.md documents for the baseline image, plus
        # jq and sha256sum for the steps below. desktop-file-utils and appstream
        # are what validate the desktop entry and the AppStream component;
        # packaging skips them silently when they are absent, so a release
        # installs them rather than leaving those checks unrun.
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential curl ca-certificates pkg-config git file jq \
            python3 desktop-file-utils binutils coreutils zsync appstream \
            dpkg-dev rpm cpio \
            libfontconfig-dev libfreetype-dev libssl-dev

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --component rustfmt --component clippy
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Check the tag against the workspace version
        # The artifact name carries no version, so the tag is where a release
        # says which one it is. A tag that disagrees with what the binaries
        # report would publish a mislabeled release.
        run: |
          set -eu
          version=$(packaging/workspace-version.sh)
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "ERROR: tag ${GITHUB_REF_NAME} does not match the workspace version ${version}." >&2
            echo "Bump [workspace.package] version in Cargo.toml, or tag v${version}." >&2
            exit 1
          fi
          echo "Releasing ${GITHUB_REF_NAME} from workspace version ${version}"

      - name: Verify the tooling datasets
        run: |
          python3 -m py_compile tools/minecraft-options/*.py tools/minecraft-options/tests/*.py tools/licenses/*.py
          python3 -m unittest discover -s tools/minecraft-options
          python3 -m unittest discover -s tools/licenses

      - name: Verify the third-party license inventory
        # A tag must not publish artifacts carrying a THIRD-PARTY-LICENSES.md
        # that the lockfile no longer produces, which is why this is in the
        # release gate and not only in CI.
        run: |
          set -eu
          PATH="$(tools/licenses/provision-tools.sh license-tools)":"$PATH"
          export PATH
          tools/licenses/generate.sh --check
          cargo deny check licenses

      - name: Verify the packaging architecture table
        # The names Debian, RPM, AppImage, and the dynamic linker each use for
        # an architecture. Nothing downstream can catch a wrong one: the
        # packaging scripts ask this table what the name is.
        run: packaging/test-linux-architectures.sh

      - name: Formatting
        run: cargo fmt --all --check

      - name: Lints
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        # Offline by contract: fixtures and loopback servers only, no Mojang,
        # Microsoft, Modrinth, CurseForge, Forge, or NeoForge service.
        run: cargo test --workspace --no-fail-fast

      - name: Provision the pinned host tools
        # Which architecture's assets to fetch, what they are named, and the
        # digest each has to match all come from packaging/host-tools. The script
        # prints where appimagetool and the runtime landed, and the build step
        # below is told that rather than assembling the paths a second time.
        run: packaging/provision-host-tools.sh provision host-tools >> "$GITHUB_ENV"

      - name: Build and package the AppImage
        env:
          # `SOURCE_DATE_EPOCH` is honored by the squashfs step, so two builds of
          # the same source produce the same bytes.
          SOURCE_DATE_EPOCH: "0"
          # Baked into the release binaries as the default CurseForge API key
          # (ADR 0030), read only by `option_env!` at compile time. Empty when
          # the secret is unset, which compiles to "no built-in key" - the
          # same as any other build.
          EPHERVEX_CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: |
          set -eu
          cargo fetch --locked
          packaging/build-appimage.sh dist

      - name: Build the Debian package
        env:
          # Must match the AppImage step's value exactly: `build-deb.sh` calls
          # the same `build_release_binaries`, and `option_env!` in
          # `ephervex-auth` makes rustc track this variable, so a different
          # value here (including unset) invalidates cargo's fingerprint and
          # silently recompiles without the baked-in CurseForge key.
          EPHERVEX_CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: |
          set -eu
          packaging/build-deb.sh dist

      - name: Build the RPM package
        env:
          # The same value again, for the same reason.
          EPHERVEX_CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: |
          set -eu
          packaging/build-rpm.sh dist

      - name: Publish the release
        env:
          TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: packaging/publish-forgejo-release.sh dist upload
