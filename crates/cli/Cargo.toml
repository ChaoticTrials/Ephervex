[package]
name = "ephervex-cli"
description = "Ephervex command-line interface."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[[bin]]
name = "ephervex"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
# A frontend depends on `ephervex-core` and nothing below it.
# No provider crate — storage, download, minecraft, loaders, … — belongs in
# this list. If a command needs something core does not expose, the fix is to
# add a service to core, not a dependency here.
ephervex-core.workspace = true
ephervex-model.workspace = true
ephervex-i18n.workspace = true
clap.workspace = true
clap_complete.workspace = true
tokio.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile.workspace = true
zip.workspace = true
