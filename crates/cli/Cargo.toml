[package]
name = "ephervex-cli"
description = "Ephervex command-line interface."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[[bin]]
name = "ephervex"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
# A frontend depends on `ephervex-core` and nothing below it.
# No provider crate - storage, download, minecraft, loaders, … - belongs in
# this list. If a command needs something core does not expose, the fix is to
# add a service to core, not a dependency here.
ephervex-core.workspace = true
ephervex-model.workspace = true
ephervex-i18n.workspace = true
clap.workspace = true
clap_complete.workspace = true
tokio.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile.workspace = true
zip.workspace = true
# Test-only, and deliberately not in `[dependencies]` above: the rule there is
# about what the shipped binary reaches through, and nothing here is compiled
# into it. These let the test harness seed a sandbox's cache using the same
# layout and envelope the launcher writes, rather than restating that layout in
# a test where it could drift. See `tests/support`. The registry seeds a
# server record the same way.
ephervex-download.workspace = true
ephervex-loaders.workspace = true
ephervex-minecraft.workspace = true
ephervex-mod-platform.workspace = true
ephervex-storage.workspace = true
chrono.workspace = true
serde_json.workspace = true
uuid.workspace = true
tokio.workspace = true
