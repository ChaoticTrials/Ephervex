[package]
name = "ephervex-core"
description = "Application services shared by the GUI and CLI. The only crate either frontend depends on."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
ephervex-model.workspace = true
ephervex-storage.workspace = true
ephervex-download.workspace = true
ephervex-minecraft.workspace = true
ephervex-auth.workspace = true
ephervex-java.workspace = true
ephervex-loaders.workspace = true
ephervex-mod-platform.workspace = true
ephervex-pack.workspace = true
ephervex-options.workspace = true
ephervex-server.workspace = true
ephervex-i18n.workspace = true
# Raising this process's descriptor limit, which std cannot do and which the
# workspace's `unsafe_code = "deny"` rules out doing through libc directly.
rustix.workspace = true
# Writing a diagnostic bundle. Reading archives is `ephervex-pack`'s job and
# stays there, hardened against the untrusted ones it is handed; this writes one
# from files the launcher already owns and never reads it back.
zip.workspace = true
image.workspace = true
tokio.workspace = true
tokio-util.workspace = true
# Bounded concurrency for a pack import's exact-file lookups: a pack may declare
# several hundred files, and `buffered` is what keeps that to a handful of
# requests in flight rather than one task per entry.
futures-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
thiserror.workspace = true
uuid.workspace = true
chrono.workspace = true
# One `.launcher` document of this crate's own: the mods panel's display cache.
# Everything else core persists belongs to a lower crate and is serialized
# there.
serde.workspace = true
serde_json.workspace = true
open.workspace = true
# The CurseForge credential header is named once, in `ephervex-mod-platform`,
# and building the authenticated artifact request needs the header type.
reqwest.workspace = true
sysinfo.workspace = true
# Reading and writing a linked server's entry in a client's servers.dat.
fastnbt.workspace = true

[dev-dependencies]
tempfile.workspace = true
# The import tests build `.mrpack` archives to import; nothing in this crate
# reads an archive itself.
zip.workspace = true
# The artwork cache and the linked-mod flows are driven against a loopback
# server, so no ordinary test depends on a provider's CDN.
wiremock.workspace = true
# Fixture jars are hashed so the download manager's verification runs for real.
sha1.workspace = true
sha2.workspace = true
hex.workspace = true
