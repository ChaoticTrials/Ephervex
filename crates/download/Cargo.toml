[package]
name = "ephervex-download"
description = "Reusable download manager: bounded concurrency, atomic writes, hash verification, cancellation."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
ephervex-model.workspace = true
reqwest.workspace = true
# `flock` for the artifact-cache maintenance lock and the per-directory
# publication lock. A kernel advisory lock is what makes the lock correct across
# processes *and* self-releasing: a launcher that is killed mid-operation leaves
# no stale lock behind for the next run to reason about.
rustix.workspace = true
tokio.workspace = true
tokio-util.workspace = true
futures-util.workspace = true
sha1.workspace = true
sha2.workspace = true
hex.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
chrono.workspace = true

[dev-dependencies]
wiremock.workspace = true
tempfile.workspace = true
# `net` is additive on top of the workspace feature set: the interrupted-download
# integration test drives a raw loopback TCP server so it can cut a response off
# mid-body, which no mock-HTTP library can express.
tokio = { workspace = true, features = ["net"] }
