[package]
name = "ephervex-auth"
description = "Microsoft/Xbox/Minecraft Services authentication behind an AccountProvider interface."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
ephervex-model.workspace = true
# Not for downloading anything: this crate needs the *one* HTTP client the
# workspace builds, so every request it makes inherits the rustls stack, the
# bounded redirect policy, the timeouts, and the launcher User-Agent
#. See the module docs in `http.rs`.
ephervex-download.workspace = true
async-trait.workspace = true
base64.workspace = true
chrono.workspace = true
getrandom.workspace = true
keyring.workspace = true
md-5.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
tempfile.workspace = true
# Used by one test only, and an important one: it installs a capturing
# subscriber and runs the whole chain at TRACE, so "no token reaches a log" is
# checked against what `tracing` actually emitted rather than asserted.
tracing-subscriber.workspace = true
wiremock.workspace = true
