[package]
name = "ephervex-gui"
description = "Ephervex desktop GUI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[[bin]]
name = "ephervex-gui"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
# A frontend depends on `ephervex-core` and nothing below it.
# No provider crate (storage, download, Minecraft, loaders, and so on) belongs in
# this list. If a screen needs something core does not expose, the fix is to
# add a service to core, not a dependency here.
slint.workspace = true
ephervex-core.workspace = true
ephervex-model.workspace = true
ephervex-i18n.workspace = true
tokio.workspace = true
chrono.workspace = true
copypasta.workspace = true
rfd.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# Keeping a window on an aspect ratio is the window manager's job, and X11 is
# where a window can ask for it. Linux only, because no other display protocol
# this build targets has an equivalent.
[target.'cfg(target_os = "linux")'.dependencies]
raw-window-handle.workspace = true
x11rb.workspace = true

[dev-dependencies]
# A headless window, so what the markup actually does with a pointer event is
# testable rather than only observable by hand.
i-slint-backend-testing.workspace = true
# A disposable launcher root, so the settings screen's save path can be proven
# against a real configuration file rather than a stand-in for one.
tempfile.workspace = true
