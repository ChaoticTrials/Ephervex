# Localization configuration read at compile time by `fluent_language_loader!()`
# and by the `fl!()` macro, which uses the fallback language's resource to check
# message ids and their arguments while the crate is being built.

# Every message must exist in the fallback language. English is the only bundled
# locale, and adding one requires a directory in `locales/` rather than a code
# refactor.
fallback_language = "en-US"

[fluent]
assets_dir = "locales"
# Without this the domain would default to the crate name and the resource would
# have to be called `ephervex-i18n.ftl`. `main.ftl` says what it is.
domain = "main"
