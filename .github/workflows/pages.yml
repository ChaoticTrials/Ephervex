# The site, its screenshots, and the options feed are all built from the tip of
# main. The screenshot tool renders the GUI's own components, so it only builds
# against the application source it was written with.
#
# Application changes alone do not rebuild the site: it follows when the website
# changes or a release is published, so screenshots do not run ahead of the text
# that describes them. The options feed rebuilds it on its own because the
# application reads that file between releases.
#
# The Release workflow publishes with GITHUB_TOKEN, so its release event cannot
# start another workflow. workflow_run covers that path; release covers releases
# published by a maintainer.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'tools/auto-screenshot-tool/**'
      - 'assets/**'
      - 'crates/options/data/minecraft-options.json'
      - '.github/workflows/pages.yml'
  release:
    types: [published]
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: main
          path: source
          persist-credentials: false

      - name: Check the options feed
        run: |
          set -euo pipefail
          jq -e '.format_version == 1 and (.revision | type == "number") and (.releases | length > 0)' \
            source/crates/options/data/minecraft-options.json >/dev/null

      - name: Install screenshot build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig-dev libfreetype-dev libssl-dev fonts-dejavu-core

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: source -> target

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: source/web/package-lock.json

      - name: Generate application screenshots
        working-directory: source
        run: ./tools/auto-screenshot-tool/generate.sh

      - name: Install website dependencies
        working-directory: source/web
        run: npm ci

      - name: Generate website images
        working-directory: source/web
        run: npm run screenshots:sync -- --size 1920x1080

      - name: Check website types
        working-directory: source/web
        run: npm run typecheck

      - name: Build website
        working-directory: source/web
        run: npm run build

      # The application reads this file as its options feed between releases.
      - name: Publish the options feed
        run: |
          set -euo pipefail
          feed=source/crates/options/data/minecraft-options.json
          install -D -m 644 "$feed" source/web/build/assets/minecraft-options.json
          cmp "$feed" source/web/build/assets/minecraft-options.json

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: source/web/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
