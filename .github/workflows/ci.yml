# Runs the checks on every push to main and on every pull request.
#
# The same gate a version tag runs before it publishes anything, so what passes
# here is what a release will find rather than a different toolchain's opinion
# of the tree.

name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - name: Install build dependencies
        # What the desktop application links against. The rest of the set the
        # release job installs is already on the runner image.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig-dev libfreetype-dev

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and target dir
        uses: Swatinem/rust-cache@v2

      - name: Verify the tooling datasets
        run: |
          python3 -m py_compile tools/minecraft-options/*.py tools/minecraft-options/tests/*.py tools/licenses/*.py
          python3 -m unittest discover -s tools/minecraft-options
          python3 -m unittest discover -s tools/licenses

      - name: Verify the third-party license inventory
        # Two halves of one rule. The staleness check regenerates the inventory
        # from Cargo.lock and fails if the committed files differ, which is
        # what makes "generated from the build" true rather than aspirational.
        # `cargo deny check licenses` is the policy half: a dependency arriving
        # under a license nobody accepted fails review instead of shipping.
        #
        # about.toml declares both release architectures, so what is checked
        # here is the union of what either artifact contains rather than what
        # this runner happens to be.
        run: |
          set -eu
          PATH="$(tools/licenses/provision-tools.sh license-tools)":"$PATH"
          export PATH
          tools/licenses/generate.sh --check
          cargo deny check licenses

      - name: Verify the packaging architecture table
        # The names Debian, RPM, AppImage, and the dynamic linker each use for
        # an architecture. Nothing downstream can catch a wrong one: the
        # packaging scripts ask this table what the name is.
        run: packaging/test-linux-architectures.sh

      - name: Verify the release asset staging
        # Which files a release ships and the checksum beside each, plus the
        # publish script's refusals. Offline, against dummy artifacts.
        run: packaging/test-release-assets.sh

      - name: Formatting
        run: cargo fmt --all --check

      - name: Lints
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        # Offline by contract: fixtures and loopback servers only, no Mojang,
        # Microsoft, Modrinth, CurseForge, Forge, or NeoForge service.
        #
        # One build, one rustc at a time: compiling the interface crate's
        # generated code takes about 14 GB, and a hosted runner has 16.
        env:
          CARGO_BUILD_JOBS: 1
        run: cargo test --workspace
