# Builds the Linux release artifacts for every release architecture and
# publishes them as a GitHub release whenever a version tag (for example
# v1.0.0) is pushed.
#
# Three artifacts per architecture: the AppImage, whose name carries the
# architecture but not the version so a download address stays valid, and the
# Debian and RPM packages, which carry their version because that is what a
# package manager and an apt repository read (ADR 0026). What identifies a
# release is its tag and what the binaries report for `--version`, which is why
# the tag and the workspace version have to agree before anything is built.
#
# Each architecture is built **natively** on a runner of its own rather than
# cross-compiled. The glibc floor, the shared-library allowlist, and the smoke
# test all inspect and run the binaries the job produced, and a cross build
# leaves every one of those unverified.
#
# Three jobs, because they need different things. The build matrix needs a
# toolchain and no repository access; publishing needs a token that can write
# releases and nothing else; the package repository needs its own credentials
# and a key. Splitting them is also what keeps two architectures from racing to
# create the same release.
#
# `appimagetool` and the AppImage type-2 runtime are host dependencies that
# build-appimage.sh never downloads. Provisioning them is this workflow's job,
# and it fetches exactly what packaging/host-tools pins for the architecture
# being built and verifies each digest before use. See docs/release.md and
# ADR 0023.

name: Release

on:
  push:
    tags:
      - "v*"

# Read-only by default. Only the publish job writes, and it raises this for
# itself.
permissions:
  contents: read

jobs:
  artifacts:
    strategy:
      # An architecture that fails should not cancel the other one's build. Both
      # have to succeed before anything is published, and seeing which of them
      # failed is worth more than stopping a minute earlier.
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          # GitHub's hosted arm64 Linux runners. There is no `-latest` form of
          # the label, so it names a release; the build happens in the baseline
          # container below either way, so which one it is does not reach the
          # artifact.
          - arch: aarch64
            runner: ubuntu-24.04-arm
    name: ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    env:
      # What the packaging scripts target. They refuse to build for an
      # architecture the host is not, so pairing an architecture with the wrong
      # runner above fails here rather than producing a mislabeled package.
      EPHERVEX_BASELINE_ARCH: ${{ matrix.arch }}
    # The runner images are far above the glibc floor packaging/linux-baseline
    # declares, and the packaging scripts refuse to package binaries that
    # require more than the floor, so every job runs in the baseline image that
    # file names. GitHub mounts its own node into the container, so the
    # JavaScript actions below still run.
    container:
      image: ubuntu:22.04
    steps:
      - name: Install build dependencies
        # Ahead of the checkout, because a bare image has no git either.
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential curl ca-certificates pkg-config git file jq \
            python3 desktop-file-utils binutils coreutils zsync appstream \
            dpkg-dev rpm cpio \
            libfontconfig-dev libfreetype-dev libssl-dev

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --component rustfmt --component clippy
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Cache cargo registry and target dir
        uses: Swatinem/rust-cache@v2

      - name: Check the tag against the workspace version
        # The artifact name carries no version, so the tag is where a release
        # says which one it is. A tag that disagrees with what the binaries
        # report would publish a mislabeled release.
        run: |
          set -eu
          version=$(packaging/workspace-version.sh)
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "ERROR: tag ${GITHUB_REF_NAME} does not match the workspace version ${version}." >&2
            echo "Bump [workspace.package] version in Cargo.toml, or tag v${version}." >&2
            exit 1
          fi
          echo "Releasing ${GITHUB_REF_NAME} from workspace version ${version}"

      - name: Verify the tooling datasets
        run: |
          python3 -m py_compile tools/minecraft-options/*.py tools/minecraft-options/tests/*.py tools/licenses/*.py
          python3 -m unittest discover -s tools/minecraft-options
          python3 -m unittest discover -s tools/licenses

      - name: Verify the third-party license inventory
        # Only on x86_64: the inventory does not depend on the machine that
        # generates it, because about.toml declares both release architectures.
        # A tag must not publish artifacts carrying a THIRD-PARTY-LICENSES.md
        # that the lockfile no longer produces, which is why this is in the
        # release gate and not only in CI.
        if: matrix.arch == 'x86_64'
        run: |
          set -eu
          PATH="$(tools/licenses/provision-tools.sh license-tools)":"$PATH"
          export PATH
          tools/licenses/generate.sh --check
          cargo deny check licenses

      - name: Verify the packaging architecture table
        # The names Debian, RPM, AppImage, and the dynamic linker each use for
        # an architecture. Nothing downstream can catch a wrong one: the
        # packaging scripts ask this table what the name is.
        run: packaging/test-linux-architectures.sh

      - name: Formatting
        run: cargo fmt --all --check

      - name: Lints
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        # Offline by contract: fixtures and loopback servers only, no Mojang,
        # Microsoft, Modrinth, CurseForge, Forge, or NeoForge service.
        #
        # Run once per architecture rather than once for the release. The whole
        # reason each architecture is built natively is that what a binary does
        # on its own machine is not deducible from what it does on another, and
        # a suite that only ever ran on one of them would leave the other
        # released untested.
        run: cargo test --workspace --no-fail-fast

      - name: Provision the pinned host tools
        # Which architecture's assets to fetch, what they are named, and the
        # digest each has to match all come from packaging/host-tools. The script
        # prints where appimagetool and the runtime landed, and the build step
        # below is told that rather than assembling the paths a second time.
        run: packaging/provision-host-tools.sh provision host-tools >> "$GITHUB_ENV"

      - name: Build and package the AppImage
        env:
          # `SOURCE_DATE_EPOCH` is honored by the squashfs step, so two builds of
          # the same source produce the same bytes.
          SOURCE_DATE_EPOCH: "0"
          # Baked into the release binaries as the default CurseForge API key
          # (ADR 0030), read only by `option_env!` at compile time. Empty when
          # the secret is unset, which compiles to "no built-in key" - the
          # same as any other build.
          EPHERVEX_CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: |
          set -eu
          cargo fetch --locked
          packaging/build-appimage.sh dist

      - name: Build the Debian package
        env:
          # Must match the AppImage step's value exactly: `build-deb.sh` calls
          # the same `build_release_binaries`, and `option_env!` in
          # `ephervex-auth` makes rustc track this variable, so a different
          # value here (including unset) invalidates cargo's fingerprint and
          # silently recompiles without the baked-in CurseForge key.
          EPHERVEX_CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: |
          set -eu
          packaging/build-deb.sh dist

      - name: Build the RPM package
        env:
          # The same value again, for the same reason.
          EPHERVEX_CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: |
          set -eu
          packaging/build-rpm.sh dist

      - name: Collect what gets published
        # The packaging scripts leave the AppDir and the two staging trees they
        # assembled in the same output directory, so what ships is copied out by
        # name instead of left for a glob to find. The names come from the
        # architecture table, which is also what produced them.
        run: packaging/stage-release-assets.sh dist upload

      - name: Keep the artifacts for the publish job
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.arch }}
          path: upload/
          if-no-files-found: error
          retention-days: 1

  # Creates the release and attaches every architecture's artifacts to it.
  #
  # Separate from the build so the two architectures cannot race to create the
  # same release, and so the token that can write to this repository is held by
  # one job that builds nothing.
  publish:
    needs: artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Collect every architecture's artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Publish the release
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu

          # Every file the build jobs put in their upload directory, which is
          # only ever the artifacts and their checksums. Nothing is assembled
          # from an architecture name here: the build that produced a file is
          # what named it.
          cd dist
          ls -l
          names="$(find . -maxdepth 1 -type f -printf '%P\n' | sort)"
          [ -n "${names}" ] || { echo "ERROR: no artifacts were collected." >&2; exit 1; }
          cd ..

          API="${GITHUB_API_URL}"
          REPO="${GITHUB_REPOSITORY}"
          TAG="${GITHUB_REF_NAME}"
          AUTH="Authorization: Bearer ${TOKEN}"
          API_VERSION="X-GitHub-Api-Version: 2022-11-28"

          # curl that prints the server's error body rather than just a number,
          # and fails the step on any HTTP >= 400.
          api() {
            method="$1"; path="$2"; shift 2
            curl -sS --fail-with-body -X "$method" -H "$AUTH" -H "$API_VERSION" "$@" "${API}${path}"
          }

          # Written as ordinary text and encoded by jq. Hand-escaping a JSON
          # string literal inside a shell double-quoted string inside YAML is
          # three escaping rules deep, and the backticks this text wants are
          # not a valid JSON escape at all.
          body="Ephervex ${TAG} for Linux on x86_64 and aarch64.

          The AppImage runs anywhere. The .deb installs \`ephervex\` and \`ephervex-gui\` on PATH for Debian, Ubuntu and derivatives, and the .rpm does the same for Fedora, openSUSE and derivatives. Take the file whose name matches your \`uname -m\`."

          # Reuse an existing release for this tag if there is one, else create it.
          existing="$(curl -sS -H "$AUTH" -H "$API_VERSION" "${API}/repos/${REPO}/releases/tags/${TAG}" || true)"
          release="$(echo "$existing" | jq -r '.id // empty')"

          if [ -z "$release" ]; then
            echo "Creating release for ${TAG}"
            existing="$(api POST "/repos/${REPO}/releases" \
              -H 'Content-Type: application/json' \
              -d "$(jq -n --arg tag "${TAG}" --arg body "${body}" \
                    '{tag_name: $tag, name: $tag, body: $body}')")"
            release="$(echo "$existing" | jq -r '.id')"
          else
            echo "Reusing existing release for ${TAG}"
          fi

          # The upload host is not the API host, and the response is what says
          # which it is, so the address is taken from there rather than assumed.
          uploads="$(echo "$existing" | jq -r '.upload_url' | sed 's/{?name,label}//')"

          # Publishing over an existing release replaces its assets rather than
          # adding to them, so a re-run cannot leave two different files under
          # one name.
          assets="$(curl -sS -H "$AUTH" -H "$API_VERSION" "${API}/repos/${REPO}/releases/${release}/assets" || echo '[]')"
          echo "${names}" | while read -r name; do
            for old in $(echo "$assets" | jq -r --arg n "$name" '.[] | select(.name == $n) | .id'); do
              echo "Removing the existing ${name} (asset ${old})"
              api DELETE "/repos/${REPO}/releases/assets/${old}" >/dev/null
            done
            echo "Uploading ${name}"
            curl -sS --fail-with-body -X POST -H "$AUTH" -H "$API_VERSION" \
              -H 'Content-Type: application/octet-stream' \
              --data-binary "@dist/${name}" \
              "${uploads}?name=${name}" >/dev/null
          done

  # Publishes the Debian and RPM packages into the shared ChaoticTrials package
  # repository, so a user who added it gets Ephervex upgrades through their
  # package manager rather than by downloading a file: apt serves
  # repo.chaotictrials.de/deb and dnf serves repo.chaotictrials.de/rpm (ADR 0026,
  # ADR 0044).
  #
  # Both architectures, because a repository serves whichever one the machine
  # asking for it is. Both formats go in one job and one commit, so the
  # repository never holds one format at the new release and the other at the
  # old one, and Ephervex never pushes twice for one release.
  #
  # This is the only place Ephervex publishes packages to a repository. The
  # Forgejo release workflow builds the same artifacts and attaches them to its
  # own release, and deliberately has no path into the repository and no
  # credentials for it.
  #
  # Separate from the build because it needs different credentials and writes to
  # a different repository. It runs only after a release exists, and it takes
  # the packages from that release rather than rebuilding them. The .deb that
  # lands in the repository is byte for byte what the release page offers; the
  # .rpm is signed on the way in, so it differs by its signature alone.
  package-repo:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout the package repository
        uses: actions/checkout@v4
        with:
          repository: ChaoticTrials/package-repo
          token: ${{ secrets.APT_REPO_TOKEN }}
          path: package-repo

      - name: Install the repository tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            aptly rpm createrepo-c gnupg

      - name: Import the signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          set -eu
          if [ -z "${GPG_PRIVATE_KEY:-}" ]; then
            echo "ERROR: the GPG_PRIVATE_KEY secret is empty or not set." >&2
            echo "An unsigned repository is one every user has to override a" >&2
            echo "security check to use, so this refuses rather than publishing one." >&2
            exit 1
          fi
          mkdir -p ~/.gnupg
          chmod 700 ~/.gnupg
          # Loopback pinentry because there is no terminal to prompt on.
          echo "pinentry-mode loopback" >> ~/.gnupg/gpg.conf
          echo "allow-loopback-pinentry" >> ~/.gnupg/gpg-agent.conf
          gpgconf --kill gpg-agent
          printf '%s' "${GPG_PRIVATE_KEY}" | gpg --batch --import

      - name: Download the packages from the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          gh release download "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" --pattern '*.deb' --dir debs
          gh release download "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" --pattern '*.rpm' --dir rpms
          # A release that somehow carries no package would otherwise publish an
          # unchanged repository and report success. Every architecture the
          # release builds has to be there, because a repository that silently
          # dropped one serves upgrades to some machines and not others.
          for arch in amd64 arm64; do
            ls debs/*_"${arch}".deb >/dev/null ||
              { echo "ERROR: the release carries no ${arch} .deb." >&2; exit 1; }
          done
          for arch in x86_64 aarch64; do
            ls rpms/*."${arch}".rpm >/dev/null ||
              { echo "ERROR: the release carries no ${arch} .rpm." >&2; exit 1; }
          done
          ls -l debs rpms

      - name: Add the Debian packages and publish the apt repository
        env:
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -eu
          mkdir -p package-repo/public
          cat > ~/.aptly.conf <<EOF
          {
            "rootDir": "${GITHUB_WORKSPACE}/package-repo/.aptly",
            "FileSystemPublishEndpoints": {
              "package-repo": {
                "rootDir": "${GITHUB_WORKSPACE}/package-repo/public",
                "linkMethod": "copy"
              }
            }
          }
          EOF

          # The repository is shared with the organization's other projects, so
          # it may already exist and already hold packages. Creating it is the
          # first-run case rather than the normal one.
          aptly repo create -distribution=stable -component=main packages 2>/dev/null || true
          aptly repo add packages debs/*.deb

          # The apt repository is served under the `deb` prefix, and the RPM
          # repository beside it under `rpm`.
          #
          # Publishing a distribution that is already published is an update,
          # not a second publish. Which one applies depends on the state of a
          # repository this job does not own, so it tries the first and falls
          # back to the second.
          # `-architectures` is recorded when a distribution is first
          # published and is not something `publish update` can change. A
          # repository already published for amd64 alone therefore needs a
          # one-time `aptly publish drop stable` and a republish before arm64
          # packages reach anyone; see docs/release.md. Doing that from here
          # would mean a release job dropping a published repository it shares
          # with other projects, which is a maintainer's decision.
          aptly publish repo \
            -gpg-key="${GPG_KEY_ID}" \
            -passphrase="${GPG_PASSPHRASE}" \
            -architectures=amd64,arm64 \
            -distribution=stable \
            packages \
            filesystem:package-repo:deb 2>/dev/null || \
          aptly publish update \
            -gpg-key="${GPG_KEY_ID}" \
            -passphrase="${GPG_PASSPHRASE}" \
            stable \
            filesystem:package-repo:deb

      - name: Add the RPM packages and publish the RPM repository
        env:
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: package-repo/scripts/publish-rpm.sh rpms

      - name: Commit the updated repository
        working-directory: package-repo
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          # A re-run of the same tag adds packages the repository already has,
          # which leaves nothing to commit. That is a success, not a failure.
          if git diff --cached --quiet; then
            echo "The package repository already carries this release."
            exit 0
          fi
          git commit -m "Release Ephervex ${GITHUB_REF_NAME}"
          git push
