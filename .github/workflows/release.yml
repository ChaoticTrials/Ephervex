# Builds the Linux release artifact and publishes it as a GitHub release
# whenever a version tag (for example v1.0.0) is pushed.
#
# The artifact has the same name on every release, Ephervex-x86_64.AppImage, so
# a download address stays valid. What identifies a release is its tag and what
# the binaries report for `--version`, which is why the tag and the workspace
# version have to agree before anything is built.
#
# `appimagetool` and the AppImage type-2 runtime are host dependencies that
# build-appimage.sh never downloads. Provisioning them is this workflow's job,
# and it fetches exactly what packaging/host-tools pins and verifies each digest
# before use. See docs/release.md and ADR 0023.

name: Release

on:
  push:
    tags:
      - "v*"

# For the publish step's own token. Nothing else here writes to the repository.
permissions:
  contents: write

jobs:
  appimage:
    runs-on: ubuntu-latest
    # The runner image is far above the glibc floor packaging/linux-baseline
    # declares, and build-appimage.sh refuses to package binaries that require
    # more than the floor, so the job runs in the baseline image that file
    # names. GitHub mounts its own node into the container, so the JavaScript
    # actions below still run.
    container:
      image: ubuntu:22.04
    steps:
      - name: Install build dependencies
        # Ahead of the checkout, because a bare image has no git either.
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential curl ca-certificates pkg-config git file jq \
            python3 desktop-file-utils binutils coreutils zsync appstream \
            libfontconfig-dev libfreetype-dev libssl-dev

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --component rustfmt --component clippy
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Cache cargo registry and target dir
        uses: Swatinem/rust-cache@v2

      - name: Check the tag against the workspace version
        # The artifact name carries no version, so the tag is where a release
        # says which one it is. A tag that disagrees with what the binaries
        # report would publish a mislabeled release.
        run: |
          set -eu
          version=$(packaging/workspace-version.sh)
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "ERROR: tag ${GITHUB_REF_NAME} does not match the workspace version ${version}." >&2
            echo "Bump [workspace.package] version in Cargo.toml, or tag v${version}." >&2
            exit 1
          fi
          echo "Releasing ${GITHUB_REF_NAME} from workspace version ${version}"

      - name: Verify the tooling datasets
        run: |
          python3 -m py_compile tools/minecraft-options/*.py
          python3 -m unittest discover -s tools/minecraft-options

      - name: Formatting
        run: cargo fmt --all --check

      - name: Lints
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        # Offline by contract: fixtures and loopback servers only, no Mojang,
        # Microsoft, Modrinth, CurseForge, Forge, or NeoForge service.
        run: cargo test --workspace --no-fail-fast

      - name: Provision the pinned host tools
        run: |
          set -eu
          . ./packaging/host-tools
          mkdir -p host-tools
          cd host-tools

          fetch() {
            url=$1; file=$2; expected=$3
            curl --proto '=https' --tlsv1.2 -sSfL -o "${file}" "${url}"
            actual=$(sha256sum "${file}" | cut -d' ' -f1)
            if [ "${actual}" != "${expected}" ]; then
              echo "ERROR: ${file} is not what packaging/host-tools pins." >&2
              echo "  expected ${expected}" >&2
              echo "  fetched  ${actual}" >&2
              echo "Upstream publishes these under rolling tags. Check the new binary," >&2
              echo "then update packaging/host-tools deliberately." >&2
              exit 1
            fi
            chmod +x "${file}"
          }

          fetch "${EPHERVEX_APPIMAGETOOL_URL}" appimagetool-x86_64.AppImage \
                "${EPHERVEX_APPIMAGETOOL_SHA256}"
          fetch "${EPHERVEX_APPIMAGE_RUNTIME_URL}" runtime-x86_64 \
                "${EPHERVEX_APPIMAGE_RUNTIME_SHA256}"

          # appimagetool ships as an AppImage, and a container has no FUSE to
          # mount one with, so it is extracted once and run from the AppDir.
          ./appimagetool-x86_64.AppImage --appimage-extract >/dev/null

      - name: Build and package the AppImage
        env:
          # `SOURCE_DATE_EPOCH` is honored by the squashfs step, so two builds of
          # the same source produce the same bytes.
          SOURCE_DATE_EPOCH: "0"
        run: |
          set -eu
          export APPIMAGETOOL="${PWD}/host-tools/squashfs-root/AppRun"
          export APPIMAGE_RUNTIME_FILE="${PWD}/host-tools/runtime-x86_64"
          cargo fetch --locked
          packaging/build-appimage.sh dist

      - name: Publish the release
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu

          ARTIFACT=Ephervex-x86_64.AppImage
          cd dist
          sha256sum "${ARTIFACT}" > "${ARTIFACT}.sha256"
          cd ..

          API="${GITHUB_API_URL}"
          REPO="${GITHUB_REPOSITORY}"
          TAG="${GITHUB_REF_NAME}"
          AUTH="Authorization: Bearer ${TOKEN}"
          VERSION="X-GitHub-Api-Version: 2022-11-28"

          # curl that prints the server's error body rather than just a number,
          # and fails the step on any HTTP >= 400.
          api() {
            method="$1"; path="$2"; shift 2
            curl -sS --fail-with-body -X "$method" -H "$AUTH" -H "$VERSION" "$@" "${API}${path}"
          }

          # Reuse an existing release for this tag if there is one, else create it.
          existing="$(curl -sS -H "$AUTH" -H "$VERSION" "${API}/repos/${REPO}/releases/tags/${TAG}" || true)"
          release="$(echo "$existing" | jq -r '.id // empty')"

          if [ -z "$release" ]; then
            echo "Creating release for ${TAG}"
            existing="$(api POST "/repos/${REPO}/releases" \
              -H 'Content-Type: application/json' \
              -d "{\"tag_name\":\"${TAG}\",\"name\":\"${TAG}\",\"body\":\"Ephervex ${TAG} for Linux x86_64.\"}")"
            release="$(echo "$existing" | jq -r '.id')"
          else
            echo "Reusing existing release for ${TAG}"
          fi

          # The upload host is not the API host, and the response is what says
          # which it is, so the address is taken from there rather than assumed.
          uploads="$(echo "$existing" | jq -r '.upload_url' | sed 's/{?name,label}//')"

          # Named one by one rather than globbed: build-appimage.sh leaves the
          # AppDir it assembled in the same output directory, and a glob would
          # try to upload a directory.
          #
          # Publishing over an existing release replaces its assets rather than
          # adding to them, so a re-run cannot leave two different files under
          # one name.
          assets="$(curl -sS -H "$AUTH" -H "$VERSION" "${API}/repos/${REPO}/releases/${release}/assets" || echo '[]')"
          for name in "${ARTIFACT}" "${ARTIFACT}.sha256"; do
            for old in $(echo "$assets" | jq -r --arg n "$name" '.[] | select(.name == $n) | .id'); do
              echo "Removing the existing ${name} (asset ${old})"
              api DELETE "/repos/${REPO}/releases/assets/${old}" >/dev/null
            done
            echo "Uploading ${name}"
            curl -sS --fail-with-body -X POST -H "$AUTH" -H "$VERSION" \
              -H 'Content-Type: application/octet-stream' \
              --data-binary "@dist/${name}" \
              "${uploads}?name=${name}" >/dev/null
          done
